services:
  postgres:
    image: postgres:16-alpine
    container_name: visionepi-postgres
    environment:
      POSTGRES_USER: visionepi
      POSTGRES_PASSWORD: visionepi
      POSTGRES_DB: visionepi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionepi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: visionepi-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      # Só os pesos YOLO — não estão no repositório (ver .gitignore: *.pt).
      # O bind-mount do projeto inteiro (`.:/app`) foi removido: ele
      # sobrescrevia o build do frontend feito na imagem e servia pra manter
      # o reload do servidor de desenvolvimento, que não roda mais aqui.
      - ./models:/app/models:ro
      - visionepi_runtime:/app/runtime
      - visionepi_instance:/app/instance
    # command herdado do Dockerfile (gunicorn) — sem `python run.py`.

volumes:
  postgres_data:
  visionepi_runtime:
  visionepi_instance:
